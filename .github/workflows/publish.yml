name: Publish package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@krometra/easy-data-scroll@$v" version >/dev/null 2>&1; then
            echo "::notice::Версия $v уже есть в npm, публикация пропущена."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack tarball
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: krometra-easy-data-scroll-*.tgz
